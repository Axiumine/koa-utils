name: Mutation

# StrykerJS mutation testing: slow (30+ minutes), advisory, never a required check.
# The main-protection ruleset requires only `Test coverage` (ci.yml), so a red run
# here blocks nothing. It runs weekly and on demand.
#
# Line coverage (c8, 100%) proves a line ran; a mutant that survives proves no test
# asserted on it. `stryker.config.json` holds the knobs, `thresholds.break` is the
# floor this job fails under, CONTRIBUTING.md explains how to read the report.

on:
  workflow_dispatch:
  schedule:
    # Sundays 03:43 UTC: away from the Monday 04:17 (scorecard.yml) and 05:17 (ci.yml) crons
    - cron: '43 3 * * 0'

# Least privilege: the job only reads the repo and writes to the Actions cache and
# artifact store, neither of which needs a token scope.
permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Incremental mode: Stryker stores every mutant result keyed by source and test
      # hashes and re-runs only the mutants whose inputs changed. The newest cache wins
      # (restore-keys prefix), a fresh key is saved after every run.
      - name: Restore incremental results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-incremental-${{ github.sha }}
          restore-keys: |
            mutation-incremental-

      # `yarn mutation` = `patch-package && stryker run`. The patch makes
      # @stryker-mutator/mocha-runner load Mocha 12 (see TODO.md); it is applied here
      # and not from a postinstall script, which would also run on consumer machines.
      - name: Mutation testing
        run: yarn mutation

      # Saved even when the score is below the break threshold, so the next run
      # still starts from these results.
      - name: Save incremental results
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-incremental-${{ github.sha }}

      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
