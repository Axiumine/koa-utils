name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Mondays 05:17 UTC: the periodic dependency audit
    - cron: '17 5 * * 1'

# Least privilege: every job only reads the repo. No secret is used, so the same
# jobs run green on Dependabot and fork PRs (qodana.yml needs QODANA_TOKEN, which
# those PRs never receive).
#
# Runners: this file, qodana.yml, semgrep.yml and mutation.yml run on the self-hosted pool
# (labels self-hosted, Linux, X64). release.yml and scorecard.yml stay on GitHub-hosted runners:
# npm trusted publishing and the Sigstore provenance need a GitHub-hosted VM. The pool is
# persistent and shared across repositories, so a fork PR reaches it only after the maintainer
# approves the run (repository setting "Require approval for all external contributors"). Keep
# that setting, add no pull_request_target or workflow_run trigger, publish no container port,
# and bind any listener to 127.0.0.1 on an OS-assigned port. The one listener in CI is the
# in-memory mongod of the test suite: it binds 127.0.0.1 on a port the OS picks (stock Linux
# range 32768-60999); only the free-port probe of mongodb-memory-server is a brief wildcard bind
# before mongod starts. Jobs that install dependencies keep their Yarn cache inside RUNNER_TEMP
# and set YARN_PROXY_REGISTRY to the public registry: the install runs `prepare`, which would
# otherwise leave the maintainer's LAN proxy filter (scripts/lockfile-registry-filter.sh) in the
# persistent checkout and rewrite yarn.lock to that host on every later checkout.
permissions:
  contents: read

jobs:
  # Decides whether the slow gates run. A pull request whose every changed file is documentation skips
  # `Test coverage`, `Test coverage (Node 26.13.0)` and Qodana; pushes, schedules and manual runs always run
  # everything. Skipping is done with a job-level `if`, never with `paths-ignore`: a job skipped by `if` reports
  # as passing for a required check, while a workflow skipped by a path filter never reports and leaves the
  # pull request waiting forever. The definition lives in .github/actions/scope.
  scope:
    name: Scope
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Docs-only change?
        id: scope
        uses: ./.github/actions/scope

  test:
    # This job name is the status-check context the main-protection ruleset requires
    # (integration_id 15368 = GitHub Actions). Renaming it without editing the ruleset
    # leaves every PR "Expected: waiting for status".
    name: Test coverage
    needs: scope
    # Fail-open: when the scope job did not succeed, the slow gates run instead of being skipped.
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      YARN_PROXY_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact floor of package.json engines (^24.14.0), not the floating 24.x line: the oldest Node a
      # consumer may run is the one the gates must pass on. Node 26 runs in the job below.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          package-manager-cache: false

      # A bare runner has Node from the step above but no Yarn: Corepack ships with Node 24.
      - name: Enable Yarn
        run: corepack enable

      # The pool is persistent and shared: a Yarn cache under the runner user's home would carry
      # one job's downloads into the next, including a job of another repository.
      - name: Isolate the Yarn cache to this job
        run: echo "YARN_CACHE_FOLDER=$RUNNER_TEMP/yarn-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # One script, one definition (package.json check:static): code caps, ESLint + Prettier read-only
      # (the former "Coding standard" step), typecheck, knip, type-coverage and FTA. Runs before the
      # tests so a static failure does not wait on the slow suite.
      - name: Static gates
        run: yarn check:static

      # Pull requests only: the ratchet files (.code-caps-baseline.json, eslint-suppressions.json) may get stricter than
      # main but never looser. Without this comparison both are honor-system files anyone could regrow. The repository is
      # public, so the fetch needs no credential (checkout runs with persist-credentials: false). Fetches the tip only.
      - name: Fetch main for the ratchet comparison
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Ratchets are no looser than main
        if: github.event_name == 'pull_request'
        run: yarn -s ratchet:against origin/main

      # Mocha report in the log; fails below 100% on lines, statements, functions or branches.
      - name: Tests and coverage gate
        run: yarn test:coverage

      # Two clean builds must produce the same bytes (docs/verify-release.md depends on it).
      - name: Build is deterministic
        run: |
          yarn build > /dev/null
          (cd dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/build-a.sum"
          yarn build > /dev/null
          (cd dist && find . -type f | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/build-b.sum"
          diff "$RUNNER_TEMP/build-a.sum" "$RUNNER_TEMP/build-b.sum"

      # `files` negates *.map; inlineSources would otherwise ship every original .mts.
      - name: Tarball ships no source maps
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" > /dev/null
          maps=$(tar tzf "$RUNNER_TEMP"/axiumine-koa-utils-*.tgz | grep -c '\.map$' || true)
          echo "source maps in tarball: $maps"
          test "$maps" -eq 0
          echo "tarball sha1: $(sha1sum "$RUNNER_TEMP"/axiumine-koa-utils-*.tgz | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

  # Second engines range of package.json (^26.13.0, the Node 26 LTS line), exact floor again. Install
  # runs here too: Yarn 1 checks engines, and the install builds through `prepare`. Static gates, the
  # ratchets and the pack checks are not repeated; they do not depend on the Node version.
  # Not a required check until the ruleset names it; `Test coverage` above stays the required context.
  test-node-26:
    name: Test coverage (Node 26.13.0)
    needs: scope
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      YARN_PROXY_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 26 does not ship Corepack (Node 25 dropped it), so a bare runner would have no Yarn after
      # Setup Node 26. Node 24 still ships it: enable the shims from a Node 24 first. The shims stay on
      # PATH and run under whichever `node` comes first, which is Node 26 after the next step.
      - name: Setup Node (Corepack source)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Enable Yarn
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # Fail here, not later, if the Yarn shim ever runs on the wrong Node. `-s` silences Yarn's own
      # banner ("yarn node v1.x", "Done in ...") so only the Node version is compared.
      - name: Check the toolchain
        run: |
          test "$(node -v)" = "v26.13.0"
          test "$(yarn -s node -v)" = "v26.13.0"

      # The pool is persistent and shared: a Yarn cache under the runner user's home would carry
      # one job's downloads into the next, including a job of another repository.
      - name: Isolate the Yarn cache to this job
        run: echo "YARN_CACHE_FOLDER=$RUNNER_TEMP/yarn-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same gate as the job above: fails below 100% on lines, statements, functions or branches.
      - name: Tests and coverage gate
        run: yarn test:coverage

  audit:
    name: Dependency audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Yarn
        run: corepack enable

      # Gate: what the package ships to consumers. It declares no runtime dependencies, so this must stay clean.
      - name: Audit shipped dependencies
        run: yarn audit --groups dependencies

      # Monitor: the development tree is not shipped. Findings are listed for triage, they do not fail the run.
      - name: Audit development tree
        run: |
          {
            echo '### yarn audit (devDependencies, high and above)'
            echo '```'
            yarn audit --groups devDependencies --level high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory: not a required check. The Trivy DB comes from ghcr.io, which rate-limits, so a red run
  # is a rerun first and a finding second. yarn audit (job above) stays the dependency gate.
  trivy:
    name: Trivy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image pinned by tag AND digest (a tag can be re-pushed, a digest cannot). Bump both together by hand:
      # docker buildx imagetools inspect aquasec/trivy:<version> --format '{{.Manifest.Digest}}'
      - name: Trivy filesystem scan (vuln, secret, misconfig)
        run: |
          docker run --rm -v "$PWD":/src:ro \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src

  # Advisory: weekly and on demand only. A regression tripwire for memory and handle leaks, too slow
  # and too timing-sensitive to gate every pull request.
  leak:
    name: Leak check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      YARN_PROXY_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Yarn
        run: corepack enable

      - name: Isolate the Yarn cache to this job
        run: echo "YARN_CACHE_FOLDER=$RUNNER_TEMP/yarn-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Leak check
        run: yarn leak:check
