name: Semgrep

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Pinned by tag AND digest: a tag can be re-pushed, a digest cannot, so the gate
  # cannot shift under a retag. Bump deliberately, tag and digest together
  # (digest: docker buildx imagetools inspect semgrep/semgrep:<version> --format '{{.Manifest.Digest}}')
  # — the canary job below is what proves a bump did not silently break detection.
  SEMGREP_IMAGE: semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942

jobs:
  semgrep:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs FIRST and deliberately gates the scan below. A rule that has been
      # narrowed, typo'd or broken by a Semgrep upgrade reports "0 findings"
      # exactly like a clean codebase does, so a passing scan is only meaningful
      # once the ruleset has been shown to still detect the vulnerable fixtures.
      - name: Canary — prove the ruleset still detects
        run: ./scripts/semgrep-canary.sh

      # Exits non-zero on any ERROR-severity finding (scripts/semgrep.sh passes
      # --error; without it semgrep exits 0 even with blocking findings).
      - name: Scan src/
        run: ./scripts/semgrep.sh

      # Registry packs (typescript, nodejs, javascript, nodejsscan, secrets). They are not
      # version pinned (the image digest pins the engine, not the rules), so an upstream rule
      # change can turn this step red with no code change: rerun, then triage. release.yml
      # keeps the custom-only scan above and never runs this step.
      - name: Scan src/ (registry packs)
        run: ./scripts/semgrep.sh --registry
