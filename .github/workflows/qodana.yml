name: Qodana

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only by default. A job that needs more declares it itself, so a job added
# later without a `permissions:` block cannot silently inherit write access.
permissions:
  contents: read

jobs:
  # Docs-only pull requests skip the scan, see the `scope` job in ci.yml. Same job, same action.
  scope:
    name: Scope
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Docs-only change?
        id: scope
        uses: ./.github/actions/scope

  qodana:
    name: Qodana Ultimate Plus
    # Dependabot PRs never receive QODANA_TOKEN (Dependabot has its own secret store),
    # so the scan cannot start there. Skip it instead of failing; Qodana still runs on
    # the push to main after the merge. Fork PRs without the secret still fail, as before.
    needs: scope
    # Fail-open: when the scope job did not succeed, the scan runs instead of being skipped.
    if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: [self-hosted, Linux, X64]
    # Per qodana-action source (v2026.2.2): checks API for the check run and annotations,
    # issues API for the PR summary comment. `contents: write` is only used by push-fixes
    # (default `none`) and `security-events: write` is never used (this action does not
    # upload to code scanning). Setting push-fixes needs `contents: write` back.
    permissions:
      contents: read # actions/checkout
      checks: write # check run and inline annotations (input use-annotations, default true)
      pull-requests: write # results summary comment on the PR (input post-pr-comment, default true)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Yarn
        run: corepack enable

      # Persistent shared runner pool: per-job Yarn cache, see the header of ci.yml.
      - name: Isolate the Yarn cache to this job
        run: echo "YARN_CACHE_FOLDER=$RUNNER_TEMP/yarn-cache" >> "$GITHUB_ENV"

      # A persistent pool runner can hold a yarn.lock smudged to the LAN proxy, which the Hetzner runner cannot resolve.
      # See .github/actions/public-lockfile.
      - name: Use the public yarn.lock
        uses: ./.github/actions/public-lockfile

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Qodana scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: --linter jetbrains/qodana-js:2026.2
          pr-mode: ${{ github.event_name == 'pull_request' }}
          upload-result: true
          use-caches: false
