name: Public yarn.lock
description: Makes the checked-out yarn.lock byte-identical to the committed one, and fails fast if it names any host but registry.npmjs.org.

runs:
  using: composite
  steps:
    # Why this exists: `yarn install` runs `prepare`, which runs `hooks:install`, which writes the maintainer's
    # `yarnlock-registry` clean/smudge filter into the persistent runner workspace's .git/config. From then on a
    # checkout can rewrite every `resolved` URL in yarn.lock to the LAN proxy, and a runner that cannot resolve
    # that host (the Hetzner one) fails in "Fetching packages" with getaddrinfo ENOTFOUND yarnproxy.gio.lan.
    # Yarn fetches the URL written in the lockfile, so only the lockfile content matters here.
    - shell: bash
      run: |
        set -euo pipefail
        # Drop the persisted filter, then write the committed blob again with both filter commands forced to `cat`
        # (the -c values win even if a runner-wide git config defines the filter). `git checkout <tree-ish> -- path`
        # overwrites the file unconditionally, so a stale or smudged copy cannot survive.
        git config --local --remove-section filter.yarnlock-registry 2>/dev/null || true
        git -c filter.yarnlock-registry.smudge=cat -c filter.yarnlock-registry.clean=cat checkout HEAD -- yarn.lock
        # Same invariant as the lockfile check in .githooks/pre-commit, now also enforced where Dependabot PRs run.
        # No pipe into grep -q (SIGPIPE under pipefail): collect the hosts first, compare after.
        hosts="$(sed -n -E 's#^[[:space:]]+resolved "https?://([^/]+)/.*#\1#p' yarn.lock | sort -u)"
        if [ "$hosts" != "registry.npmjs.org" ]; then
          echo "::error file=yarn.lock::every resolved URL must use https://registry.npmjs.org/ but found: $(echo "$hosts" | tr '\n' ' ')"
          exit 1
        fi
        echo "yarn.lock: all $(grep -c -E '^[[:space:]]+resolved ' yarn.lock) resolved URLs use registry.npmjs.org" >> "$GITHUB_STEP_SUMMARY"
