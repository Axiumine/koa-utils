name: Feature request
description: Propose a new helper or a change to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API (export path, signature). Say whether it would break existing consumers.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Constraints
      options:
        - label: It needs no new runtime `dependencies` (third-party packages must stay optional peers).
          required: true
        - label: I am willing to open a pull request with tests and docs.
          required: false
